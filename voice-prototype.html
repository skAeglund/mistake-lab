<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Chess — MistakeLab Prototype</title>
<link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #232736;
    --border: #2d3244;
    --text: #e2e4ea;
    --text-dim: #7a7f94;
    --accent: #5b8af5;
    --accent-glow: rgba(91, 138, 245, 0.15);
    --green: #4ade80;
    --green-glow: rgba(74, 222, 128, 0.15);
    --red: #f87171;
    --red-glow: rgba(248, 113, 113, 0.15);
    --orange: #fb923c;
    --radius: 10px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px;
  }

  h1 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  h1 span { color: var(--accent); }

  .layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
    max-width: 900px;
    width: 100%;
  }

  .board-col { flex: 0 0 auto; }

  #board { width: 400px; }
  .board-b72b1 { border-radius: var(--radius); overflow: hidden; border: 2px solid var(--border); }

  .panel {
    flex: 1;
    min-width: 280px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
  }

  .card-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  /* Mic button */
  .mic-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #btnMic {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-size: 24px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #btnMic:hover { border-color: var(--accent); color: var(--accent); }
  #btnMic.listening {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-glow);
    animation: pulse-mic 1.5s infinite;
  }
  #btnMic.listening::after {
    content: '';
    position: absolute;
    width: 56px; height: 56px;
    border-radius: 50%;
    border: 2px solid var(--green);
    animation: ripple 1.5s infinite;
  }

  @keyframes pulse-mic {
    0%, 100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.3); }
    50% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
  }
  @keyframes ripple {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.6); opacity: 0; }
  }

  .mic-status {
    font-size: 0.9rem;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .mic-status .heard {
    font-family: 'JetBrains Mono', monospace;
    color: var(--accent);
    font-weight: 600;
  }

  /* Confirm buttons */
  .confirm-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .confirm-row button {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  #btnConfirmYes { border-color: var(--green); color: var(--green); }
  #btnConfirmYes:hover { background: var(--green-glow); }
  #btnConfirmNo { border-color: var(--red); color: var(--red); }
  #btnConfirmNo:hover { background: var(--red-glow); }
  .confirm-row.hidden { display: none; }

  /* Log */
  #log {
    max-height: 260px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .log-entry {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    line-height: 1.5;
    padding: 4px 8px;
    border-radius: 6px;
  }
  .log-entry.user { color: var(--green); background: var(--green-glow); }
  .log-entry.opponent { color: var(--accent); background: var(--accent-glow); }
  .log-entry.system { color: var(--text-dim); }
  .log-entry.error { color: var(--red); background: var(--red-glow); }
  .log-entry .move-san { font-weight: 700; }

  /* Settings */
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
  }
  .setting-row label {
    font-size: 0.85rem;
    color: var(--text-dim);
  }
  .toggle {
    position: relative;
    width: 40px; height: 22px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toggle::after {
    content: '';
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--text-dim);
    top: 2px; left: 2px;
    transition: all 0.2s;
  }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle.on::after { left: 20px; background: #fff; }

  select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 4px 8px;
    font-size: 0.8rem;
    font-family: 'DM Sans', sans-serif;
  }

  /* Browser warning */
  .warning {
    background: var(--red-glow);
    border: 1px solid var(--red);
    border-radius: var(--radius);
    padding: 12px 16px;
    font-size: 0.85rem;
    color: var(--red);
    max-width: 900px;
    width: 100%;
    margin-bottom: 16px;
    display: none;
  }

  /* Mobile */
  @media (max-width: 740px) {
    .layout { flex-direction: column; align-items: center; }
    #board { width: min(90vw, 400px); }
    .panel { min-width: unset; width: min(90vw, 400px); }
  }
</style>
</head>
<body>

<h1><span>Voice Chess</span> — MistakeLab Prototype</h1>

<div class="warning" id="browserWarning">
  Web Speech API not supported in this browser. Please use Chrome or Edge.
</div>

<div class="layout">
  <div class="board-col">
    <div id="board"></div>
  </div>

  <div class="panel">
    <!-- Voice control -->
    <div class="card">
      <div class="card-title">Voice Control</div>
      <div class="mic-row">
        <button id="btnMic" title="Toggle microphone">🎙</button>
        <div class="mic-status" id="micStatus">Tap to start listening</div>
      </div>
      <div class="confirm-row hidden" id="confirmRow">
        <button id="btnConfirmYes">✓ Yes</button>
        <button id="btnConfirmNo">✗ No</button>
      </div>
      <div class="confirm-row" style="margin-top:6px">
        <button id="btnTestTts" style="border-color:var(--accent);color:var(--accent)">🔊 Test TTS</button>
        <button id="btnTestParse" style="border-color:var(--orange);color:var(--orange)">⌨ Type a move</button>
      </div>
    </div>

    <!-- Settings -->
    <div class="card">
      <div class="card-title">Settings</div>
      <div class="setting-row">
        <label>Confirm moves</label>
        <div class="toggle on" id="toggleConfirm" data-key="confirm"></div>
      </div>
      <div class="setting-row">
        <label>Announce opponent</label>
        <div class="toggle on" id="toggleAnnounce" data-key="announce"></div>
      </div>
      <div class="setting-row">
        <label>TTS Voice</label>
        <select id="voiceSelect"></select>
      </div>
      <div class="setting-row">
        <label>Speed <span id="speedLabel" style="color:var(--accent)">1.0×</span></label>
        <input type="range" id="speedSlider" min="0.5" max="2.0" step="0.1" value="1.0"
          style="width:120px;accent-color:var(--accent)">
      </div>
      <div class="setting-row">
        <label>Play as</label>
        <select id="colorSelect">
          <option value="white">White</option>
          <option value="black">Black</option>
        </select>
      </div>
      <div class="setting-row">
        <label>Match engine</label>
        <select id="engineSelect">
          <option value="v2">V2 — fuzzy phrasings</option>
          <option value="v1">V1 — direct parse</option>
        </select>
      </div>
    </div>

    <!-- Move log -->
    <div class="card">
      <div class="card-title">Move Log</div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
(function() {
  'use strict';

  // ── State ──
  let game = new Chess();
  let board = null;
  let playerColor = 'white'; // 'white' or 'black'
  let listening = false;
  let recognition = null;
  let pendingMove = null;  // { san, from, to, promotion } waiting for confirmation
  let settings = { confirm: true, announce: true };
  let selectedVoice = null;
  let speaking = false;  // true while TTS is active — suppresses recognition

  // ── DOM refs ──
  const btnMic = document.getElementById('btnMic');
  const micStatus = document.getElementById('micStatus');
  const confirmRow = document.getElementById('confirmRow');
  const btnYes = document.getElementById('btnConfirmYes');
  const btnNo = document.getElementById('btnConfirmNo');
  const logEl = document.getElementById('log');
  const voiceSelect = document.getElementById('voiceSelect');
  const colorSelect = document.getElementById('colorSelect');
  const browserWarning = document.getElementById('browserWarning');

  // ═══════════════════════════════════════════
  //  LEXICON — unified word → value mapping
  // ═══════════════════════════════════════════

  // Every recognized word maps to a value token. Unknown words are stripped.
  const LEX = {
    // Pieces (including plurals — speech recognizers often return these)
    'knight': 'N', 'knights': 'N', 'night': 'N', 'nights': 'N', 'horse': 'N', 'nite': 'N',
    'ninth': 'N', 'nice': 'N', 'knife': 'N', 'knit': 'N', 'height': 'N', 'light': 'N',
    'might': 'N', 'lights': 'N', 'right': 'N', 'white': 'N',
    'bishop': 'B', 'bishops': 'B', 'bitch': 'B', 'tissue': 'B', 'chip': 'B',
    'rook': 'R', 'rooks': 'R', 'brooke': 'R', 'brook': 'R', 'rock': 'R', 'rookie': 'R',
    'truck': 'R', 'took': 'R', 'luke': 'R', 'crooked': 'R', 'crook': 'R', 'ruck': 'R',
    'queen': 'Q', 'queens': 'Q', 'cream': 'Q', 'clean': 'Q',
    'king': 'K', 'kings': 'K', 'keen': 'K', 'thing': 'K',
    'pawn': 'P', 'pawns': 'P', 'pond': 'P', 'palm': 'P',
    // Files — bare letters
    'a': 'a', 'b': 'b', 'c': 'c', 'd': 'd', 'e': 'e', 'f': 'f', 'g': 'g', 'h': 'h',
    // Files — phonetic / NATO + common mishearings
    'alpha': 'a', 'alfa': 'a', 'anna': 'a', 'apple': 'a', 'able': 'a', 'ay': 'a', 'eh': 'a', 'ace': 'a',
    'bravo': 'b', 'beta': 'b', 'baker': 'b', 'boy': 'b', 'bee': 'b', 'be': 'b',
    'charlie': 'c', 'cat': 'c', 'chris': 'c', 'sea': 'c', 'see': 'c',
    'delta': 'd', 'david': 'd', 'dog': 'd', 'dee': 'd', 'day': 'd',
    'echo': 'e', 'edward': 'e', 'easy': 'e', 'eagle': 'e', 'he': 'e', 'eat': 'e', 'eve': 'e',
    'foxtrot': 'f', 'fox': 'f', 'frank': 'f', 'fred': 'f', 'of': 'f',
    'golf': 'g', 'george': 'g', 'gee': 'g',
    'hotel': 'h', 'henry': 'h', 'harry': 'h', 'age': 'h', 'each': 'h',
    // Ranks
    '1': '1', 'one': '1', 'won': '1',
    '2': '2', 'two': '2', 'too': '2', 'tu': '2',
    '3': '3', 'three': '3', 'tree': '3', 'free': '3',
    '4': '4', 'four': '4', 'fore': '4',
    '5': '5', 'five': '5', 'fife': '5', 'hive': '5',
    '6': '6', 'six': '6',
    '7': '7', 'seven': '7',
    '8': '8', 'eight': '8', 'ate': '8',
    // Capture / special
    'takes': 'x', 'take': 'x', 'capture': 'x', 'captures': 'x',
    'promote': '=', 'promotes': '=', 'promotion': '=', 'equals': '=',
    'castle': 'O', 'castles': 'O',
    'short': 'O-O', 'kingside': 'O-O', 'king side': 'O-O',
    'long': 'O-O-O', 'queenside': 'O-O-O', 'queen side': 'O-O-O',
    // Confirmation
    'yes': 'YES', 'yeah': 'YES', 'yep': 'YES', 'yup': 'YES', 'correct': 'YES',
    'confirm': 'YES', 'ok': 'YES', 'okay': 'YES', 'sure': 'YES', 'go': 'YES', 'play': 'YES',
    'no': 'NO', 'nah': 'NO', 'nope': 'NO', 'cancel': 'NO', 'wrong': 'NO', 'undo': 'NO',
    'to': '_IGNORE', 'the': '_IGNORE', 'on': '_IGNORE',
    'uh': '_IGNORE', 'um': '_IGNORE', 'and': '_IGNORE', 'hmm': '_IGNORE',
    'check': '_IGNORE', 'mate': '_IGNORE',
  };

  const FILES = new Set('abcdefgh');
  const RANKS = new Set('12345678');
  const PIECES = new Set('PNBRQK');

  // ═══════════════════════════════════════════
  //  INPUT NORMALIZATION
  // ═══════════════════════════════════════════

  function heardToValues(rawText) {
    const words = rawText.toLowerCase().trim().split(/\s+/);

    // Expand compound words that encode multiple chess tokens.
    // "ninety" = "knight e", "ninety-five" = "knight e five"
    const EXPAND = {
      'ninety': ['knight', 'e'],
      'ninety-five': ['knight', 'e', 'five'],
      'ninety-four': ['knight', 'e', 'four'],
      'ninety-three': ['knight', 'e', 'three'],
      'ninety-two': ['knight', 'e', 'two'],
      'ninety-one': ['knight', 'e', 'one'],
      'ninety-six': ['knight', 'e', 'six'],
      'ninety-seven': ['knight', 'e', 'seven'],
      'ninety-eight': ['knight', 'e', 'eight'],
    };
    for (let i = 0; i < words.length; i++) {
      const exp = EXPAND[words[i]];
      if (exp) { words.splice(i, 1, ...exp); i += exp.length - 1; }
    }

    // Handle raw digit strings: "95" → recognizer wrote ninety-five as digits
    // Digit 9 at start encodes "knight e" + remaining rank digit(s)
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      if (/^9[1-8]$/.test(w)) {
        words.splice(i, 1, 'knight', 'e', w[1]);
        i += 2;
      }
    }

    // Aggressively split merged tokens that contain chess characters.
    // Handles: "e4"→["e","4"], "ad1"→["a","d","1"], "ae1"→["a","e","1"]
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      if (LEX[w]) continue; // already a known word, don't split
      if (w.length < 2) continue;

      // Try to split into individual chess chars (files a-h, ranks 1-8)
      const chars = [];
      let allChess = true;
      for (const ch of w) {
        if (/[a-h1-8]/.test(ch)) chars.push(ch);
        else { allChess = false; break; }
      }
      if (allChess && chars.length >= 2) {
        words.splice(i, 1, ...chars);
        i += chars.length - 1;
      }
    }

    // Map words to value tokens, drop unknowns and _IGNORE
    const values = [];
    const dropped = [];
    for (const w of words) {
      const v = LEX[w];
      if (v && v !== '_IGNORE') values.push(v);
      else if (!v) dropped.push(w);
    }
    if (dropped.length > 0) logSystem(`Dropped: [${dropped.join(', ')}]`);
    return values;
  }

  // ═══════════════════════════════════════════
  //  BUILD MOVE PHRASINGS (Lichess-style)
  // ═══════════════════════════════════════════
  //
  // For each legal move, generate all reasonable ways a human might say it.
  // Each phrasing is an array of value tokens.
  // Returns: Map<san, { phrasings: string[][], isSan: boolean, uci: string }>

  function buildMovePhrasings() {
    const legalMoves = game.moves({ verbose: true });
    const moveMap = new Map(); // san → { phrasings, uci }

    // Count how many pieces of each type can move to each square (for disambiguation)
    const piecesToSquare = {}; // "N_f3" → [{from, san}]
    for (const m of legalMoves) {
      if (m.piece === 'p') continue;
      const key = `${m.piece.toUpperCase()}_${m.to}`;
      if (!piecesToSquare[key]) piecesToSquare[key] = [];
      piecesToSquare[key].push(m);
    }

    for (const m of legalMoves) {
      const san = m.san;
      const piece = m.piece.toUpperCase();
      const fromF = m.from[0], fromR = m.from[1];
      const toF = m.to[0], toR = m.to[1];
      const isCapture = m.captured !== undefined;
      const phrasings = [];

      // Castling
      if (m.flags.includes('k')) { // kingside
        phrasings.push(['O-O']);
        phrasings.push(['O']);       // just "castle" if only one castle legal
        moveMap.set(san, { phrasings, uci: m.from + m.to });
        continue;
      }
      if (m.flags.includes('q')) { // queenside
        phrasings.push(['O-O-O']);
        phrasings.push(['O']);
        moveMap.set(san, { phrasings, uci: m.from + m.to });
        continue;
      }

      // Promotion
      const promoMatch = san.match(/=([NBRQ])/);
      const promoSuffix = promoMatch ? [promoMatch[1]] : [];
      const promoWithEq = promoMatch ? ['=', promoMatch[1]] : [];

      if (piece === 'P') {
        // Pawn moves
        // "e4", "pawn e4"
        phrasings.push([toF, toR, ...promoSuffix]);
        phrasings.push(['P', toF, toR, ...promoSuffix]);

        if (isCapture) {
          // "e takes d5", "exd5"
          phrasings.push([fromF, 'x', toF, toR, ...promoSuffix]);
          phrasings.push([fromF, toF, toR, ...promoSuffix]);
          phrasings.push(['P', 'x', toF, toR, ...promoSuffix]);
        }

        // Full UCI: "e2 e4"
        phrasings.push([fromF, fromR, toF, toR, ...promoSuffix]);

        if (promoMatch) {
          // Also allow "promote queen" form
          phrasings.push([toF, toR, ...promoWithEq]);
          if (isCapture) phrasings.push([fromF, 'x', toF, toR, ...promoWithEq]);
        }
      } else {
        // Piece moves
        const ambigKey = `${piece}_${m.to}`;
        const siblings = piecesToSquare[ambigKey] || [];
        const needsDisambig = siblings.length > 1;

        // Standard: "Knight f3"
        phrasings.push([piece, toF, toR]);

        // With capture: "Knight takes f3"
        if (isCapture) {
          phrasings.push([piece, 'x', toF, toR]);
        }

        // Disambiguated: "Knight g f3" or "Knight 1 f3"
        if (needsDisambig) {
          // Check what disambiguation is needed
          const sameFile = siblings.some(s => s.from[0] === fromF && s.from !== m.from);
          const sameRank = siblings.some(s => s.from[1] === fromR && s.from !== m.from);

          if (!sameFile) {
            // File disambiguates
            phrasings.push([piece, fromF, toF, toR]);
            if (isCapture) phrasings.push([piece, fromF, 'x', toF, toR]);
          }
          if (!sameRank) {
            // Rank disambiguates
            phrasings.push([piece, fromR, toF, toR]);
            if (isCapture) phrasings.push([piece, fromR, 'x', toF, toR]);
          }
          // Full disambiguation
          phrasings.push([piece, fromF, fromR, toF, toR]);
        }

        // Full UCI: "g1 f3"
        phrasings.push([fromF, fromR, toF, toR]);
      }

      moveMap.set(san, { phrasings, uci: m.from + m.to + (promoMatch ? promoMatch[1].toLowerCase() : '') });
    }

    return moveMap;
  }

  // ═══════════════════════════════════════════
  //  FUZZY TOKEN MATCHING
  // ═══════════════════════════════════════════

  // Edit distance on token arrays, with chess-aware substitution costs.
  // Identical = 0, similar (same category) = 0.3, different = 1.0, insert/delete = 0.6
  function tokenDistance(heard, target) {
    const n = heard.length, m = target.length;
    const dp = Array.from({ length: n + 1 }, () => new Float32Array(m + 1));

    for (let i = 0; i <= n; i++) dp[i][0] = i * 0.6;
    for (let j = 0; j <= m; j++) dp[0][j] = j * 0.6;

    for (let i = 1; i <= n; i++) {
      for (let j = 1; j <= m; j++) {
        const h = heard[i - 1], t = target[j - 1];
        let subCost;
        if (h === t) {
          subCost = 0;
        } else if (FILES.has(h) && FILES.has(t)) {
          subCost = 0.8; // file→file confusion (b/d/e)
        } else if (RANKS.has(h) && RANKS.has(t)) {
          subCost = 0.8; // rank→rank confusion
        } else if (PIECES.has(h) && PIECES.has(t)) {
          subCost = 0.9; // piece→piece confusion
        } else {
          subCost = 1.2; // cross-category = very costly
        }

        dp[i][j] = Math.min(
          dp[i - 1][j] + 0.6,     // delete (extra heard token)
          dp[i][j - 1] + 0.8,     // insert (missing heard token)
          dp[i - 1][j - 1] + subCost // substitute
        );
      }
    }
    return dp[n][m];
  }

  // Main match function: returns best SAN or null
  function matchMove(heardValues) {
    if (heardValues.length === 0) return null;

    // Handle confirmation
    if (pendingMove) {
      if (heardValues.includes('YES')) return { type: 'confirm', value: true };
      if (heardValues.includes('NO')) return { type: 'confirm', value: false };
    }

    // Handle bare castle
    if (heardValues.includes('O-O') || heardValues.includes('O-O-O') || heardValues.includes('O')) {
      // Filter to just the castle-relevant tokens
      const castleVals = heardValues.filter(v => v === 'O' || v === 'O-O' || v === 'O-O-O');
      const wantsLong = castleVals.includes('O-O-O');
      const legalSans = game.moves();
      if (wantsLong && legalSans.includes('O-O-O')) return { type: 'move', san: 'O-O-O' };
      if (!wantsLong && legalSans.includes('O-O')) return { type: 'move', san: 'O-O' };
      // Bare "castle" — pick whichever is legal, or the only one
      const castles = legalSans.filter(s => s.startsWith('O-O'));
      if (castles.length === 1) return { type: 'move', san: castles[0] };
      return null;
    }

    // Strip non-move tokens for matching
    const moveValues = heardValues.filter(v => v !== 'YES' && v !== 'NO');
    if (moveValues.length === 0) return null;

    const moveMap = buildMovePhrasings();
    let bestSan = null, bestCost = Infinity, secondCost = Infinity;
    let bestIsSan = false;
    const results = [];

    for (const [san, { phrasings }] of moveMap) {
      let moveBestCost = Infinity;

      for (const phrasing of phrasings) {
        const cost = tokenDistance(moveValues, phrasing);
        // Normalize by target length to avoid bias toward short phrasings
        const normCost = cost / Math.max(phrasing.length, 1);

        if (normCost < moveBestCost) moveBestCost = normCost;
      }

      // SAN-form bonus: if this is the "standard" way to say the move, slight preference
      const isSanForm = phrasings.some(p => {
        const s = p.join('');
        return s === san.replace(/[+#x=]/g, '');
      });

      results.push({ san, cost: moveBestCost, isSan: isSanForm });
    }

    // Sort by cost
    results.sort((a, b) => a.cost - b.cost);

    if (results.length === 0) return null;

    bestCost = results[0].cost;
    secondCost = results.length > 1 ? results[1].cost : Infinity;

    // If best match is too expensive, reject
    if (bestCost > 0.75) {
      logEntry('error', `No confident match (best: ${results[0].san} cost=${bestCost.toFixed(2)})`);
      return null;
    }

    // If there's a clear winner
    if (secondCost - bestCost > 0.1) {
      return { type: 'move', san: results[0].san };
    }

    // Tied — collect all moves within 0.1 of best
    const tied = results.filter(r => r.cost - bestCost <= 0.1);

    // Tiebreaker 1: prefer SAN-standard phrasing
    const sanTied = tied.filter(r => r.isSan);
    if (sanTied.length === 1) return { type: 'move', san: sanTied[0].san };

    // Tiebreaker 2: prefer pawn moves (user didn't say a piece name)
    const heardPiece = moveValues.some(v => PIECES.has(v));
    if (!heardPiece) {
      const pawnTied = tied.filter(r => {
        const m = game.moves({ verbose: true }).find(mv => mv.san === r.san);
        return m && m.piece === 'p';
      });
      if (pawnTied.length === 1) return { type: 'move', san: pawnTied[0].san };
    }

    // Still ambiguous
    logEntry('error', `Ambiguous (${tied.map(r => `${r.san}:${r.cost.toFixed(2)}`).join(', ')})`);
    return { type: 'ambiguous', moves: tied.map(r => r.san) };
  }

  // ═══════════════════════════════════════════
  //  V1 ENGINE — direct parse + filter (original)
  // ═══════════════════════════════════════════

  function matchMoveV1(heardValues, rawText) {
    if (heardValues.length === 0) return null;

    // Handle confirmation
    if (pendingMove) {
      if (heardValues.includes('YES')) return { type: 'confirm', value: true };
      if (heardValues.includes('NO')) return { type: 'confirm', value: false };
    }

    // Castle
    if (heardValues.includes('O-O-O')) {
      const sans = game.moves();
      if (sans.includes('O-O-O')) return { type: 'move', san: 'O-O-O' };
    }
    if (heardValues.includes('O-O') || heardValues.includes('O')) {
      const sans = game.moves();
      if (sans.includes('O-O')) return { type: 'move', san: 'O-O' };
      const castles = sans.filter(s => s.startsWith('O-O'));
      if (castles.length === 1) return { type: 'move', san: castles[0] };
    }

    // Extract structured parts from value tokens
    let piece = null, files = [], ranks = [], hasCapture = false, promotion = null;
    let expectPromo = false;

    for (const v of heardValues) {
      if (v === 'YES' || v === 'NO' || v === 'O' || v === 'O-O' || v === 'O-O-O') continue;
      if (expectPromo && PIECES.has(v) && v !== 'P') { promotion = v; expectPromo = false; continue; }
      if (v === '=') { expectPromo = true; continue; }
      if (v === 'x') { hasCapture = true; continue; }
      if (PIECES.has(v) && piece === null && files.length === 0 && ranks.length === 0) {
        piece = (v === 'P') ? null : v;
        continue;
      }
      if (FILES.has(v)) { files.push(v); continue; }
      if (RANKS.has(v)) { ranks.push(v); continue; }
    }

    // Build target square
    let toFile = null, toRank = null, fromFile = null, fromRank = null;
    if (files.length >= 2 && ranks.length >= 2) {
      fromFile = files[0]; fromRank = ranks[0]; toFile = files[1]; toRank = ranks[1];
    } else if (files.length === 2 && ranks.length === 1) {
      fromFile = files[0]; toFile = files[1]; toRank = ranks[0];
    } else if (files.length === 1 && ranks.length === 2) {
      fromRank = ranks[0]; toFile = files[0]; toRank = ranks[1];
    } else if (files.length === 1 && ranks.length === 1) {
      toFile = files[0]; toRank = ranks[0];
    }

    if (!toFile || !toRank) return null;

    // Score legal moves
    const legalMoves = game.moves({ verbose: true });
    let candidates = [];

    for (const m of legalMoves) {
      const isPawn = (m.piece === 'p');
      const mTo = m.to;
      if (mTo[0] !== toFile || mTo[1] !== toRank) continue;

      let score = 10;

      if (piece) {
        const mp = isPawn ? null : m.piece.toUpperCase();
        if (mp === piece) score += 5;
        else continue;
      } else {
        if (isPawn) score += 6; else score -= 3;
      }

      if (fromFile) {
        if (m.from[0] === fromFile) score += 3; else score -= 2;
      }
      if (fromRank) {
        if (m.from[1] === fromRank) score += 3; else score -= 2;
      }
      if (hasCapture && m.captured) score += 1;

      if (promotion) {
        const mp = m.san.match(/=([NBRQ])/);
        if (mp && mp[1] === promotion) score += 4;
        else if (mp) score -= 1;
        else continue;
      }

      candidates.push({ san: m.san, score });
    }

    if (candidates.length === 0) return null;
    candidates.sort((a, b) => b.score - a.score);
    if (candidates.length === 1 || candidates[0].score > candidates[1].score) {
      return { type: 'move', san: candidates[0].san };
    }

    logEntry('error', `V1 Ambiguous: ${candidates.map(c => `${c.san}:${c.score}`).join(', ')}`);
    return { type: 'ambiguous', moves: candidates.map(c => c.san) };
  }

  // ═══════════════════════════════════════════
  //  TEXT-TO-SPEECH
  // ═══════════════════════════════════════════

  function speak(text) {
    return new Promise(resolve => {
      speaking = true;
      const u = new SpeechSynthesisUtterance(text);
      u.voice = selectedVoice;
      u.rate = parseFloat(document.getElementById('speedSlider').value);
      u.pitch = 1.0;
      u.onend = () => { speaking = false; resolve(); };
      u.onerror = () => { speaking = false; resolve(); };
      speechSynthesis.speak(u);
    });
  }

  function moveToSpeech(san) {
    if (san === 'O-O') return 'castles short';
    if (san === 'O-O-O') return 'castles long';

    let s = san.replace(/[+#]/g, '');
    const pieces = { N: 'Knight', B: 'Bishop', R: 'Rook', Q: 'Queen', K: 'King' };
    const parts = [];

    // Promotion
    let promo = '';
    const promoMatch = s.match(/=([NBRQ])/);
    if (promoMatch) {
      promo = pieceFullName(promoMatch[1]);
      s = s.replace(/=[NBRQ]/, '');
    }

    // Piece
    if (/^[NBRQK]/.test(s)) {
      parts.push(pieces[s[0]]);
      s = s.slice(1);
    }

    // Remaining chars: disambig + capture + destination
    // Space every character for clear TTS: "ce2" → "c . e . 2"
    for (const ch of s) {
      if (ch === 'x') { parts.push('takes'); }
      else { parts.push(ch); }
    }

    if (promo) parts.push('promotes to', promo);

    // Join with commas for slight TTS pauses between letters
    // "Knight", "c", "e", "2" → "Knight, c, e, 2"
    let speech = parts[0] || '';
    for (let i = 1; i < parts.length; i++) {
      // Add comma pause between single-char tokens for clarity
      const prev = parts[i - 1], cur = parts[i];
      if (prev.length === 1 && cur.length === 1) speech += ', ' + cur;
      else speech += ' ' + cur;
    }

    return speech;
  }

  function pieceFullName(p) {
    return { N: 'Knight', B: 'Bishop', R: 'Rook', Q: 'Queen', K: 'King' }[p] || p;
  }

  // ═══════════════════════════════════════════
  //  SPEECH RECOGNITION
  // ═══════════════════════════════════════════

  function initRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      browserWarning.style.display = 'block';
      btnMic.disabled = true;
      return;
    }

    recognition = new SR();
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.lang = 'en-US';

    recognition.onresult = (event) => {
      // Get the latest final result
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          const text = event.results[i][0].transcript.trim();
          handleVoiceInput(text);
        }
      }
    };

    recognition.onerror = (event) => {
      if (event.error === 'no-speech' || event.error === 'aborted') return;
      logEntry('error', `Recognition error: ${event.error}`);
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        listening = false;
        btnMic.classList.remove('listening');
        micStatus.textContent = 'Microphone access denied. Check browser permissions.';
        logEntry('error', 'Mic permission denied — enable in browser settings and reload.');
      } else if (event.error === 'network') {
        logEntry('error', 'Network error — Web Speech API requires internet (audio is sent to Google for processing).');
      }
    };

    recognition.onend = () => {
      // Auto-restart if we're supposed to be listening
      if (listening) {
        try { recognition.start(); } catch(e) {}
      }
    };
  }

  function toggleListening() {
    if (!recognition) return;
    if (listening) {
      listening = false;
      recognition.stop();
      stopBtKeepAlive();
      btnMic.classList.remove('listening');
      micStatus.textContent = 'Tap to start listening';
    } else {
      listening = true;
      try {
        recognition.start();
        startBtKeepAlive();
        btnMic.classList.add('listening');
        micStatus.textContent = 'Listening…';
      } catch(e) {
        listening = false;
        logEntry('error', `Could not start recognition: ${e.message}`);
        micStatus.textContent = 'Failed to start — check mic permissions';
      }
    }
  }

  // ═══════════════════════════════════════════
  //  MOVE FLOW
  // ═══════════════════════════════════════════

  async function handleVoiceInput(rawText) {
    if (speaking) return; // ignore mic input while TTS is active (prevents echo)
    logSystem(`Heard: "${rawText}"`);
    const values = heardToValues(rawText);
    logSystem(`Tokens: [${values.join(', ')}]`);

    if (values.length === 0) return;

    const engine = document.getElementById('engineSelect').value;
    const result = engine === 'v1'
      ? matchMoveV1(values, rawText)
      : matchMove(values);

    if (!result) {
      micStatus.innerHTML = `<span class="heard">"${rawText}"</span> — no match (${engine})`;
      await speak("No matching move. Try again.");
      return;
    }

    if (result.type === 'confirm' && pendingMove) {
      if (result.value) {
        confirmRow.classList.add('hidden');
        await executePendingMove();
      } else {
        pendingMove = null;
        confirmRow.classList.add('hidden');
        micStatus.textContent = 'Move cancelled. Listening…';
        await speak('Cancelled');
      }
      return;
    }

    if (result.type === 'ambiguous') {
      const moveNames = result.moves.slice(0, 3).map(s => moveToSpeech(s));
      micStatus.innerHTML = `<span class="heard">Ambiguous:</span> ${result.moves.join(' or ')}`;
      await speak(`Ambiguous. ${moveNames.join(', or ')}.`);
      return;
    }

    if (result.type !== 'move') return;

    // Not our turn?
    const turn = game.turn() === 'w' ? 'white' : 'black';
    if (turn !== playerColor) {
      await speak("It's not your turn");
      return;
    }

    const san = result.san;
    const spokenMove = moveToSpeech(san);

    if (settings.confirm) {
      pendingMove = san;
      micStatus.innerHTML = `<span class="heard">${spokenMove}</span> — confirm?`;
      confirmRow.classList.remove('hidden');
      await speak(spokenMove + '?');
    } else {
      pendingMove = san;
      await executePendingMove();
    }
  }

  async function executePendingMove() {
    if (!pendingMove) return;

    const san = pendingMove;
    pendingMove = null;

    const result = game.move(san);
    if (!result) {
      logEntry('error', `Failed to play ${san}`);
      return;
    }

    board.position(game.fen());
    logEntry('user', `${moveNumber()}${san}`);
    micStatus.innerHTML = `Played <span class="heard">${moveToSpeech(san)}</span>`;

    // Check game over
    if (checkGameOver()) return;

    // Opponent responds (random legal move for prototype)
    await delay(600);
    await opponentMove();
  }

  async function opponentMove() {
    const moves = game.moves();
    if (moves.length === 0) { checkGameOver(); return; }

    // Random move (in MistakeLab this would be Explorer/Maia/Stockfish)
    const san = moves[Math.floor(Math.random() * moves.length)];
    game.move(san);
    board.position(game.fen());
    logEntry('opponent', `${moveNumber(true)}${san}`);

    const spokenMove = moveToSpeech(san);
    micStatus.innerHTML = `Opponent: <span class="heard">${spokenMove}</span>`;

    if (settings.announce) {
      await speak(spokenMove);
    }

    checkGameOver();
  }

  function moveNumber(afterOpponent = false) {
    const fullMoves = game.history().length;
    const n = Math.ceil(fullMoves / 2);
    if (afterOpponent) {
      // Just played opponent move, show number with dots
      return game.turn() === 'w' ? `${n}… ` : `${n}. `;
    }
    return game.turn() === 'b' ? `${n}. ` : `${n}… `;
  }

  function checkGameOver() {
    if (game.in_checkmate()) {
      const winner = game.turn() === 'w' ? 'Black' : 'White';
      logEntry('system', `Checkmate! ${winner} wins.`);
      speak(`Checkmate. ${winner} wins.`);
      return true;
    }
    if (game.in_draw()) {
      logEntry('system', 'Draw.');
      speak('Draw.');
      return true;
    }
    if (game.in_stalemate()) {
      logEntry('system', 'Stalemate.');
      speak('Stalemate.');
      return true;
    }
    return false;
  }

  // ═══════════════════════════════════════════
  //  UI HELPERS
  // ═══════════════════════════════════════════

  function logEntry(type, text) {
    const div = document.createElement('div');
    div.className = `log-entry ${type}`;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  function logSystem(text) {
    logEntry('system', text);
  }

  function delay(ms) {
    return new Promise(r => setTimeout(r, ms));
  }

  // ═══════════════════════════════════════════
  //  INIT
  // ═══════════════════════════════════════════

  function initBoard() {
    board = Chessboard('board', {
      position: 'start',
      orientation: playerColor,
      pieceTheme: 'https://lichess1.org/assets/_Qn4tz2/piece/cburnett/{piece}.svg',
      draggable: false,
      moveSpeed: 200,
      appearSpeed: 200,
    });
  }

  function initVoices() {
    const populate = () => {
      const voices = speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';
      if (voices.length === 0) return;

      // Filter English voices and score by quality
      const enVoices = [];
      voices.forEach((v, i) => {
        if (!v.lang.startsWith('en')) return;
        let quality = 0;
        const n = v.name.toLowerCase();
        // Network/cloud voices tend to be higher quality
        if (!v.localService) quality += 10;
        // Prefer names suggesting high quality
        if (n.includes('neural') || n.includes('natural')) quality += 8;
        if (n.includes('enhanced') || n.includes('premium')) quality += 6;
        if (n.includes('google')) quality += 4;
        // Slight preference for US English
        if (v.lang === 'en-US') quality += 1;
        // Slight preference for female voices (often clearer for short phrases)
        if (n.includes('female') || n.includes('zira') || n.includes('samantha')) quality += 1;
        enVoices.push({ voice: v, idx: i, quality });
      });

      // Sort best first
      enVoices.sort((a, b) => b.quality - a.quality);

      let bestIdx = enVoices.length > 0 ? enVoices[0].idx : 0;
      enVoices.forEach(ev => {
        const opt = document.createElement('option');
        opt.value = ev.idx;
        const tag = ev.voice.localService ? '' : ' ☁';
        opt.textContent = `${ev.voice.name}${tag}`;
        voiceSelect.appendChild(opt);
      });

      voiceSelect.value = bestIdx;
      selectedVoice = voices[bestIdx];
    };
    speechSynthesis.onvoiceschanged = populate;
    populate();
  }

  // ═══════════════════════════════════════════
  //  BLUETOOTH AUDIO KEEPALIVE
  // ═══════════════════════════════════════════

  // Bluetooth A2DP sleeps the audio channel after silence, causing the first
  // ~200-500ms of TTS to be clipped. A near-silent oscillator keeps it awake.
  let btKeepAliveCtx = null;

  function startBtKeepAlive() {
    if (btKeepAliveCtx) return;
    try {
      btKeepAliveCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = btKeepAliveCtx.createOscillator();
      const gain = btKeepAliveCtx.createGain();
      gain.gain.value = 0.001; // inaudible but keeps channel alive
      osc.connect(gain);
      gain.connect(btKeepAliveCtx.destination);
      osc.start();
    } catch(e) {
      // AudioContext not available — ignore
    }
  }

  function stopBtKeepAlive() {
    if (btKeepAliveCtx) {
      btKeepAliveCtx.close().catch(() => {});
      btKeepAliveCtx = null;
    }
  }

  function initToggles() {
    document.querySelectorAll('.toggle').forEach(el => {
      el.addEventListener('click', () => {
        el.classList.toggle('on');
        settings[el.dataset.key] = el.classList.contains('on');
      });
    });
  }

  function init() {
    initBoard();
    initRecognition();
    initVoices();
    initToggles();

    btnMic.addEventListener('click', toggleListening);

    document.getElementById('btnTestTts').addEventListener('click', () => {
      speak('Knight takes f7. Your move.');
    });

    document.getElementById('btnTestParse').addEventListener('click', () => {
      const text = prompt('Type what you would say (e.g. "knight charlie 3"):');
      if (text) handleVoiceInput(text);
    });

    btnYes.addEventListener('click', async () => {
      confirmRow.classList.add('hidden');
      await executePendingMove();
    });

    btnNo.addEventListener('click', async () => {
      pendingMove = null;
      confirmRow.classList.add('hidden');
      micStatus.textContent = 'Move cancelled. Listening…';
    });

    voiceSelect.addEventListener('change', () => {
      const voices = speechSynthesis.getVoices();
      selectedVoice = voices[parseInt(voiceSelect.value)];
    });

    const speedSlider = document.getElementById('speedSlider');
    const speedLabel = document.getElementById('speedLabel');
    speedSlider.addEventListener('input', () => {
      speedLabel.textContent = parseFloat(speedSlider.value).toFixed(1) + '×';
    });

    colorSelect.addEventListener('change', () => {
      playerColor = colorSelect.value;
      game = new Chess();
      board.orientation(playerColor);
      board.position('start');
      logEl.innerHTML = '';
      logSystem(`Playing as ${playerColor}`);
      if (playerColor === 'black') {
        opponentMove();
      }
    });

    logSystem('Ready. Tap 🎙 to begin.');
    logSystem('Say moves like "Knight f3" or "echo 4"');
  }

  // Wait for DOM + libraries
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

})();
</script>
